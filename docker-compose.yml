# docker-compose.yml
# ──────────────────────────────────────────────────────────────
# Runs the full stack: Postgres + Redis + Flask API
#
# Usage:
#   docker-compose up --build          # first time
#   docker-compose up                  # subsequent runs
#   docker-compose down -v             # stop & remove volumes
# ──────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ecomm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ecommerce_ops
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (Celery broker) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecomm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Flask API ───────────────────────────────────────────────
  api:
    build: .
    container_name: ecomm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV:      production
      DATABASE_URL:   postgresql://postgres:postgres@db:5432/ecommerce_ops
      REDIS_URL:      redis://redis:6379/0
      SECRET_KEY:     super-secret-change-in-prod
      JWT_SECRET_KEY: jwt-secret-change-in-prod
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models        # persist trained model
      - ./logs:/app/logs
    command: >
      gunicorn "app:create_app('production')"
               --bind 0.0.0.0:5000
               --workers 4
               --timeout 120
               --access-logfile -

volumes:
  postgres_data:
